# Build the forms-engine image for amd64 + arm64 (OCI Always Free Ampere A1 nodes are arm64)
# and push it to GHCR. If an OKE kubeconfig is stored as a secret, also roll it out.
name: forms-engine image

on:
  push:
    branches: [stable]
    paths: ["services/forms-engine/**", ".github/workflows/forms-engine.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Roll out to the OKE cluster after building (needs the OKE_KUBECONFIG secret)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency: { group: forms-engine-image, cancel-in-progress: true }

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/forms-engine

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/forms-engine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.FORMS_ENGINE_AUTODEPLOY == 'true') }}
    runs-on: ubuntu-latest
    environment: oci-oke
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl from the stored kubeconfig
        env: { KUBECONFIG_B64: "${{ secrets.OKE_KUBECONFIG }}" }
        run: |
          test -n "$KUBECONFIG_B64" || { echo "OKE_KUBECONFIG secret not set"; exit 1; }
          mkdir -p ~/.kube && echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
      - name: Apply manifests and pin the new image
        run: |
          kubectl apply -f services/forms-engine/k8s/deployment.yaml -f services/forms-engine/k8s/service.yaml
          kubectl -n forms-engine set image deploy/forms-engine forms-engine=${{ env.IMAGE }}:${{ github.sha }}
          kubectl -n forms-engine rollout status deploy/forms-engine --timeout=10m
          kubectl -n forms-engine get svc forms-engine -o wide
